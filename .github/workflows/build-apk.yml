
name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose project files
        shell: bash
        run: |
          echo "===== REPOSITORY ROOT ====="
          pwd
          ls -la

          echo "===== SEARCHING PROJECT FILES ====="
          find . -maxdepth 5 -type f \( \
            -name package.json -o \
            -name package-lock.json -o \
            -name capacitor.config.json -o \
            -name index.html -o \
            -name strip-internet-permission.cjs \
          \) -print

      - name: Verify project configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            echo "ERROR: package.json is missing."
            echo "Add the project's package.json to the repository root."
            exit 1
          fi

          if [ ! -f capacitor.config.json ]; then
            echo "ERROR: capacitor.config.json is missing."
            exit 1
          fi

          if [ ! -f index.html ]; then
            echo "ERROR: index.html is missing."
            exit 1
          fi

          if [ ! -f video-player.html ] || [ ! -d video-src ]; then
            echo "ERROR: embedded video player page/assets are missing."
            exit 1
          fi

          if [ ! -f download-center.html ] || [ ! -d download-src ] || [ ! -f android-native/YouTubeDownloadPlugin.kt ] || [ ! -f android-native/YouTubeDownloadService.kt ]; then
            echo "ERROR: embedded Nice Downloader page or native sources are missing."
            exit 1
          fi

          if [ ! -f scripts/strip-internet-permission.cjs ]; then
            echo "ERROR: Internet permission script is missing."
            exit 1
          fi

          if [ ! -f scripts/integrate-native-media.cjs ] || [ ! -f android-native/MediaPermissionPlugin.kt ] || [ ! -f android-native/MediaLibraryScannerPlugin.kt ] || [ ! -f android-native/MerajPlaybackService.kt ]; then
            echo "ERROR: Native media integration files are missing."
            exit 1
          fi

          echo "Project configuration verified."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Verify built HTML and local assets
        run: node scripts/verify-web-assets.cjs dist

      - name: Generate Android project
        run: npx cap add android

      - name: Integrate native media and Nice Downloader plugins
        run: node scripts/integrate-native-media.cjs

      - name: Allow YouTube downloader network access
        run: node scripts/strip-internet-permission.cjs

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Ensure downloader network access after Capacitor sync
        run: node scripts/strip-internet-permission.cjs

      - name: Verify Capacitor copied web assets
        run: node scripts/verify-web-assets.cjs android/app/src/main/assets/public

      - name: Verify Android manifest
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Android manifest not found."
            exit 1
          fi

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "ERROR: INTERNET permission required for Nice Downloader is missing."
            cat "$MANIFEST"
            exit 1
          fi

          if ! grep -q 'android.permission.READ_MEDIA_AUDIO' "$MANIFEST"; then
            echo "ERROR: READ_MEDIA_AUDIO permission is missing."
            cat "$MANIFEST"
            exit 1
          fi

          if ! grep -q 'android.permission.READ_MEDIA_VIDEO' "$MANIFEST"; then
            echo "ERROR: READ_MEDIA_VIDEO permission is missing."
            cat "$MANIFEST"
            exit 1
          fi

          if ! grep -q 'android.permission.READ_EXTERNAL_STORAGE' "$MANIFEST"; then
            echo "ERROR: Legacy media read permission is missing."
            cat "$MANIFEST"
            exit 1
          fi

          echo "Downloader network permission plus audio/video permissions verified."

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK contains its referenced web assets
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          python3 - "$APK" <<'PYVERIFY'
          import posixpath, re, sys, zipfile
          apk = sys.argv[1]
          html_files = ["index.html", "video-player.html", "download-center.html"]
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              total_refs = 0
              for html_name in html_files:
                  apk_name = "assets/public/" + html_name
                  if apk_name not in names:
                      raise SystemExit(f"APK is missing {apk_name}")
                  html = z.read(apk_name).decode("utf-8", "replace")
                  refs = re.findall(r"""(?:src|href)=["']([^"']+)["']""", html)
                  refs = [r for r in refs if not r.startswith(("http:", "https:", "data:", "//", "/"))]
                  for ref in refs:
                      target = posixpath.normpath("assets/public/" + ref.split("?", 1)[0].lstrip("./"))
                      if target not in names:
                          raise SystemExit(f"{apk_name} references missing asset: {target}")
                  if not any(r.endswith(".js") for r in refs):
                      raise SystemExit(f"{apk_name} has no local JavaScript bundle reference")
                  if not any(r.endswith(".css") for r in refs):
                      raise SystemExit(f"{apk_name} has no local CSS reference")
                  total_refs += len(refs)
              print("APK web pages verified:", len(html_files), "pages,", total_refs, "local references")
          PYVERIFY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meraj-media-player-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
